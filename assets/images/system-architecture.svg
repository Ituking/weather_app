<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f8f9fa" rx="10" ry="10" />

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Weather Forecast App System Configuration</text>

  <!-- Flutter Mobile App -->
  <rect x="100" y="100" width="200" height="100" rx="10" ry="10" fill="#42A5F5" stroke="#1976D2" stroke-width="2" />
  <text x="200" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Flutter Mobile App</text>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">(User Interface)</text>

  <!-- Cloud Functions -->
  <rect x="500" y="100" width="200" height="100" rx="10" ry="10" fill="#0D47A1" stroke="#002171" stroke-width="2" />
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Cloud Functions</text>
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">(API Handler)</text>

  <!-- OpenWeatherMap API -->
  <rect x="500" y="250" width="200" height="100" rx="10" ry="10" fill="#78909C" stroke="#455A64" stroke-width="2" />
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">OpenWeatherMap</text>
  <text x="600" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">(External API)</text>

  <!-- Cloud Firestore -->
  <rect x="500" y="400" width="200" height="100" rx="10" ry="10" fill="#FFCA28" stroke="#F57C00" stroke-width="2" />
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Cloud Firestore</text>
  <text x="600" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">(Real-time Database)</text>

  <!-- Weather Display -->
  <rect x="100" y="400" width="200" height="100" rx="10" ry="10" fill="#42A5F5" stroke="#1976D2" stroke-width="2" />
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Weather Display</text>
  <text x="200" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">(Flutter App)</text>

  <!-- Daily Batch Job -->
  <rect x="300" y="550" width="200" height="60" rx="10" ry="10" fill="#8E24AA" stroke="#6A1B9A" stroke-width="2" />
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Daily Batch Job</text>
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">毎日 0:01 実行 - 前日データ削除</text>

  <!-- Arrows & Labels -->
  <path d="M 300 150 L 500 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="375" y="130" width="50" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">1</text>

  <path d="M 600 200 L 600 250" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="580" y="215" width="40" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2</text>

  <path d="M 500 300 L 400 300 L 400 175 L 500 175" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="380" y="280" width="40" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">3</text>

  <path d="M 550 200 L 550 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="530" y="325" width="40" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="550" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4</text>

  <path d="M 500 450 L 300 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="375" y="430" width="50" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">5</text>

  <!-- Batch to Firestore -->
  <path d="M 400 550 L 600 500" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <rect x="480" y="490" width="40" height="20" rx="10" ry="10" fill="white" stroke="#333" stroke-width="1" />
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">6</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Descriptions -->
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">City Name Input</text>
  <text x="630" y="230" font-family="Arial, sans-serif" font-size="12" fill="#333">API Request</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">Weather Data Response</text>
  <text x="570" y="350" font-family="Arial, sans-serif" font-size="12" fill="#333">Store Data</text>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Real-time Updates</text>

  <!-- Legend -->
  <rect x="150" y="620" width="500" height="25" rx="5" ry="5" fill="white" stroke="#ddd" stroke-width="1" />
  <text x="400" y="638" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Data Flow: User Input → API Processing → Data Storage → Real-time Display + Cleanup
  </text>
</svg>
